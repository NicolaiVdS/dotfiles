###############################################################################
#                           code syntax highlighting                          #
###############################################################################

code_syntax_highlight = "carbonfox"

###############################################################################
#                                 base colors                                 #
###############################################################################

#-- full screen
full_screen_fg = "#f2f4f8"
full_screen_bg = "#161616"

#-- gradient
# note: this currently only supports two colors.
gradient_color = ["#78a9ff", "#be95ff"]
directory_icon_color = "#78a9ff"

#-- file panel
file_panel_fg = "#f2f4f8"
file_panel_bg = "#161616"
file_panel_border = "#353b49"
file_panel_border_active = "#78a9ff"
file_panel_top_directory_icon = "#25be6a"
file_panel_top_path = "#78a9ff"
file_panel_item_selected_fg = "#78a9ff"
file_panel_item_selected_bg = "#2a2a2a"

#-- footer
footer_fg = "#f2f4f8"
footer_bg = "#161616"
footer_border = "#353b49"
footer_border_active = "#25be6a"

#-- sidebar
sidebar_fg = "#f2f4f8"
sidebar_bg = "#161616"
sidebar_title = "#3ddbd9"
sidebar_border = "#161616"
sidebar_border_active = "#ee5396"
sidebar_item_selected_fg = "#78a9ff"
sidebar_item_selected_bg = "#2a2a2a"
sidebar_divider = "#353b49"

#-- modals
modal_fg = "#f2f4f8"
modal_bg = "#161616"
modal_border_active = "#78a9ff"
modal_cancel_fg = "#161616"
modal_cancel_bg = "#ee5396"
modal_confirm_fg = "#161616"
modal_confirm_bg = "#25be6a"

#-- help menu
help_menu_hotkey = "#3ddbd9"
help_menu_title = "#ee5396"

#-- special
cursor = "#f2f4f8"
correct = "#25be6a"
error = "#ee5396"
hint = "#3ddbd9"
cancel = "#ee5386"
